[project]
name = "nanomite"
version = "0.1.0"
description = "Minimal-resource security and AI toolkit for old laptops"
license = { text = "NANOMITE Proprietary License" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "mypy>=1.0", "ruff>=0.1.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py39"