[package]
name = "nanomite"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.2", features = ["crossterm"] }
tokio = { version = "1.53.2", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream", "blocking", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.92"
dirs = "7.0.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
