[package]
name = "nanomite"
version = "1.2.0"
edition = "2021"
description = "NANOMITE — Intelligence Without Boundaries."
license = "MIT"
repository = "https://github.com/ritchegerona/nanomite"
readme = "README.md"
keywords = ["cli", "terminal", "ai", "agent", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.2", features = ["crossterm"] }
tokio = { version = "1.53.2", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream", "blocking", "form"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.17", features = ["v4", "serde"], optional = true }
serde_json = "1.0"
regex = "1.10"
walkdir = "2.5"
async-trait = "0.1.92"
dirs = "7.0.0"
# Process-group kill for hook/exec children: on timeout, grandchildren (e.g.
# `sleep 30` spawned by a hook script) must die too, or they hold the pipe
# write-ends and the reader threads block until the grandchild exits.
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
memchr = "2.7"
memmap2 = "0.9"
unicode-width = "0.2"
chrono = { version = "0.4", features = ["serde"] }
# Authoritative structured-memory store. `bundled` keeps the SQLite build
# self-contained (no system libsqlite3 needed) and enables FTS5 full-text search.
rusqlite = { version = "0.37", default-features = false, features = ["bundled"] }
# Evidence integrity hashing for the HACKER MODE findings store. Already in the
# dependency graph (via the optional pdf-extract feature); a direct dep makes
# the hash explicit and survives `--no-default-features` builds.
sha2 = "0.10"
# NanomiteVPN - WireGuard-inspired personal VPN
ring = { version = "0.17", optional = true }
# NanomiteTOR - v3 onion address derivation (SHA3-256 checksum).
sha3 = { version = "0.10", optional = true }
blake3 = { version = "1.5", optional = true }
hex = { version = "0.4", optional = true }
getrandom = { version = "0.3", optional = true }
stun-client = { version = "0.1", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }

# --- file intelligence (extract layer) -------------------------------------
# Every parser dependency is optional and pulled in by the matching
# `format-*` feature so builds can drop a family of parsers entirely.
csv = { version = "1.3", optional = true }
quick-xml = { version = "0.42", optional = true }
toml = { version = "1", optional = true }
base64 = "0.22"
yaml-rust2 = { version = "0.13", optional = true }
# Zip containers only need deflate; the default feature set drags in
# aes/zstd/lzma/zopfli which we neither want to compile nor would ever run.
zip = { version = "9", default-features = false, features = ["deflate-flate2"], optional = true }
pdf-extract = { version = "0.12", optional = true }

# tokio-tun is Linux-only (TUN/TAP via ioctl). On other platforms we use a stub.
# NOTE: this section must stay AFTER all [dependencies] entries: a table header
# switches context, so placed above, every dep below it would become
# Linux-only and silently vanish from macOS/Windows builds.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-tun = { version = "0.4", default-features = false }

[features]
default = [
    "format-structured",
    "format-tabular",
    "format-documents",
    "format-pdf",
]
# NanomiteVPN module
vpn = [
    "dep:ring",
    "dep:blake3",
    "dep:getrandom",
    "dep:stun-client",
    "dep:clap",
    "dep:hex",
    "dep:uuid",
]
# NanomiteTOR module (library-only; requires an external `tor` binary at runtime)
tor = [
    "dep:uuid",
    "dep:sha3",
    "dep:ring",
    "dep:getrandom",
    "dep:hex",
]
# JSON/YAML/TOML/XML parsing
format-structured = ["dep:toml", "dep:yaml-rust2", "dep:quick-xml"]
# CSV, XLSX, ODS (spreadsheets need zip + quick-xml)
format-tabular = ["dep:csv", "dep:zip", "dep:quick-xml"]
# DOCX, ODT (document containers need zip + quick-xml)
format-documents = ["dep:zip", "dep:quick-xml"]
# PDF text extraction
format-pdf = ["dep:pdf-extract"]

[[bench]]
name = "perf"
harness = false

[[example]]
name = "smoke_vpn_tor"
required-features = ["vpn", "tor"]


[dev-dependencies]
tempfile = "3.15"
chrono = { version = "0.4", features = ["serde"] }
shellexpand = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
