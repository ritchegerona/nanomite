# Cargo deny configuration for nanomite
# See https://github.com/EmbarkStudios/cargo-deny for documentation

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[output]
feature-depth = 1

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "Transitive dependency via lopdf -> pdf-extract for PDF text extraction. No safe alternative; pdf-extract 0.12 uses lopdf which uses ttf-parser. Will monitor for pdf-extract migration to skrifa." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []