name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Plain `cargo test` also builds benches/perf.rs, which needs nightly
      # (#![feature(test)]). The offline suite is `cargo test --lib`.
      - name: Format
        run: cargo fmt --check

      - name: Check (lib + bins)
        run: cargo check --lib --bins

      - name: Clippy (lib + bins, warnings denied)
        run: cargo clippy --lib --bins -- -D warnings

      - name: Test (offline suite)
        run: cargo test --lib

  release-binary:
    name: Attach linux binary to release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar czf "nanomite-v${VERSION}-x86_64-linux.tar.gz" -C target/release nanomite
          sha256sum "nanomite-v${VERSION}-x86_64-linux.tar.gz" > "nanomite-v${VERSION}-x86_64-linux.tar.gz.sha256"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "nanomite-v${VERSION}-x86_64-linux.tar.gz" \
            "nanomite-v${VERSION}-x86_64-linux.tar.gz.sha256" \
            --clobber
