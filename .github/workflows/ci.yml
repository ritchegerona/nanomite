name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --all-targets
        run: cargo check --all-targets
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test --lib
        run: cargo test --lib -- --test-threads=1
      - name: cargo test integration
        run: cargo test --test production_attach --test agent_integration

  vpn-tor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --all-targets --features vpn,tor
        run: cargo check --all-targets --features vpn,tor
      - name: cargo clippy --features vpn,tor -D warnings
        run: cargo clippy --all-targets --features vpn,tor -- -D warnings
      - name: cargo test --lib --features vpn,tor
        run: cargo test --lib --features vpn,tor -- --test-threads=1

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench
        run: cargo bench

  release-build:
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release
        run: cargo build --release
      - name: upload binaries to the tag
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/nanomite-ai
