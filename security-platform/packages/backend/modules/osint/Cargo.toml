[package]
name = "security-platform-osint"
version = "0.1.0"
edition = "2021"

[dependencies]
security-platform-core = { path = "../../core" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
anyhow = "1.0"
chrono = "0.4"