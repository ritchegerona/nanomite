[package]
name = "security-platform-scheduled-tasks"
version = "0.1.0"
edition = "2021"

[dependencies]
security-platform-core = { path = "../../core" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }