[package]
name = "security-platform-tool-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
security-platform-core = { path = "../../core" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
anyhow = "1.0"
uuid = { version = "1.7", features = ["v4"] }