services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: security_platform
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../packages/backend/core/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d security_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "shared_preload_libraries=vector"]

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data: